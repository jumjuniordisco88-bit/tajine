<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Live Output Monitor</title>
    <style>
        body { background: #0f172a; color: #38bdf8; font-family: monospace; text-align: center; padding-top: 80px; }
        #resultBox { font-size: 22px; border: 2px solid #38bdf8; padding: 25px; display: inline-block; margin-top: 20px; background: #020617; border-radius: 8px; }
    </style>
</head>
<body>
    <h1>LIVE CAPTURE MONITOR</h1>
    <div id="resultBox">Connecting to target storage...</div>

    <script>
        const binUrl = 'https://api.npoint.io/de1504b3aa33f17f65e1'; // Put your exact npoint URL here too!

        function checkBin() {
            fetch(binUrl)
                .then(response => response.json())
                .then(data => {
                    document.getElementById('resultBox').innerText = data.log;
                });
        }

        // Check the bin every 1 second
        setInterval(checkBin, 1000);
    </script>
</body>
</html>
