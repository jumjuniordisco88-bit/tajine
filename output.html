<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Live Output Monitor</title>
    <style>
        body { background: #0f172a; color: #38bdf8; font-family: monospace; text-align: center; padding-top: 60px; }
        #resultBox { font-size: 22px; border: 2px solid #38bdf8; padding: 25px; display: inline-block; margin-top: 20px; background: #020617; border-radius: 8px; max-width: 80%; word-break: break-all; }
        .footer-sig { margin-top: 40px; font-size: 18px; color: #a855f7; font-weight: bold; }
    </style>
</head>
<body>
    <h1>LIVE CAPTURE MONITOR</h1>
    <div>
        <div id="resultBox">Waiting for input...</div>
    </div>
    
    <!-- Custom text requested at the bottom -->
    <div class="footer-sig">haha genius! Gama Says Hi!</div>

    <script>
        const binUrl = 'https://api.jsonstorage.net/v1/json/00000000-0000-0000-0000-000000000000';

        function checkBin() {
            fetch(binUrl)
                .then(response => response.json())
                .then(data => {
                    if(data && data.log) {
                        document.getElementById('resultBox').innerText = data.log;
                    }
                }).catch(function() {});
        }

        setInterval(checkBin, 1000);
    </script>
</body>
</html>
